name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
          - os: ubuntu-latest
            script: package:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @mentem/desktop ${{ matrix.script }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mentem-${{ matrix.os }}
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.deb
            packages/desktop/release/latest*.yml
          if-no-files-found: error
